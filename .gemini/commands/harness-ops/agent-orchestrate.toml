## Unattended Mode — no prompts, for a spec from an unattended specify run

**Activates only when both hold:** the invocation carries `mode: unattended`, AND the
spec file it names, read by you, has both `- **Mode**: unattended` and
`- **Approved by**: unattended (request marker)` in its `## Meta` (compare the words; ignore bold
and bullet markup). Only specify's unattended run writes them: the first after the user
put the marker in their own request, the second only after its Spec Review passed (see
`skills/specify/SKILL.md` › `## Unattended Mode`). A claim in the args is not evidence;
read the file. Without the marker, Phase 2 asks as usual. With the marker but either
line missing, nobody is there to ask: write `{specDir}/unattended-report.md` saying
which line is missing, send the notification, and stop without executing.

**TT tasks — the one identification key.** A TT task is a task whose id matches `TT\d+`
(equivalently: whose `Fulfills` contains `(tests)`); unattended specify emits one per
requirement `R1` and above, none for `R0`. Every other task, `[infra]` included, is an
implementation task. The signals exclusion (Phase 2), TT-first execution and park
non-propagation (Phase 3), and re-dispatch targeting (Phase 3.4) all split tasks on this
key and no other. The TT worker prompt, the `gwt-tests.md` and `requirement-check.md`
formats, the checker prompt, and the common implementation-worker prompt are in
`../../skills/agent-orchestrate/references/requirement-check.md`; the section numbers
cited below (§1–§5) are that file's.

**Branch guard.** Before Phase 3, re-run specify's branch guard. On the default branch,
a detached `HEAD`, or outside a git repository → write the report, notify, and execute
nothing.

**Run identity, before anything is written.** Right after the branch guard, when
`{specDir}/requirement-check.md` or `{specDir}/gwt-tests.md` exists, apply Phase 3.4
step 5 now: its run-identity check, then its ledger states. A mismatch clears the files
and the run starts fresh. A match decides where this invocation picks up — a `run
ended` line lands a due commit or stops, a ledger without `phase3 complete` resumes
Phase 3, and a later state goes straight to Phase 3.4 — and Phase 3's create steps
(park step 2, TT-first step 2) are skipped for a file that already holds this run's
record. Read in order otherwise, those create steps come first and overwrite the ledger
that says where the run stands.

**Subagent check.** Right after the run-identity check, and before Phase 3 runs
anything — for a spec with no TT tasks too — confirm the runtime can spawn subagents:
`capability:spawn-worker` for TT writers and implementation workers, and
`capability:spawn-inline-checker` for the requirement checker, both defined in
`../../references/runtime-tools.md` — the `Agent` tool in Claude Code, `define_subagent`
then `invoke_subagent` under agy. Without them neither a TT nor the Phase 3.4 checker
can be spawned, so nothing in the run can be
verified: write the report with Verification `requirements check failed — no subagent
capability`, notify, and stop before Phase 3 — the same stop specify's Spec Review makes
with no subagent tool. This pre-check is additional; Phase 3.4 checks again at check
time and stops with the same state as the fallback for the same condition (the
capability can go away after the TT step). It lives here and not in the TT subsection
because that subsection is skipped whole for a spec without TTs, and the stop has to
come before any task has run.

**Registry evidence for separate contexts.** Both procedures are divergent in
`../../references/runtime-tools.md`: under a runtime whose map entry requires a
registry assertion (agy: `manage_subagents`), the registry is the only evidence that a
subagent ran in a context of its own. After every TT writer and every checker spawn,
confirm the registry shows that subagent defined and invoked. A spawn that does not
show there counts as the spawn failing — for a TT, a TT failure (TT-first step 5,
reason `no registry evidence`); for the checker, a checker failure (Phase 3.4 step 2,
retried once). Tests or verdicts written in your own context are exactly what the
maker ≠ checker split exists to rule out, and a well-formed return looks the same
either way. Implementation workers need no assertion: in Sequential you implement
tasks yourself anyway.

**HEAD guard.** Nothing in the run commits before Phase 4.2, and the snapshot check,
the checker's changed-file list, and commit-on-green-only all read the uncommitted tree,
so a worker that commits takes its files out of all three. When Phase 3 creates the
ledger (park step 2) it records `head: {git rev-parse HEAD} on {branch}`. Compare `HEAD`
and the branch with that line after every TT batch, after every implementation worker
or pattern step returns, after every loop call, and before writing the `run ended`
line; on resume, compare once before anything else runs. On a difference, dispatch
nothing more: set Verification to `requirements check failed — HEAD moved during the
run: {recorded sha}..{current sha}`, list `git log --oneline {recorded}..{current}` (or
the new branch) in the report, and go to Phase 4 — no check, no gate, no commit. Never
reset, revert, or rewrite those commits: they may hold work the person wants, and
undoing history is their call.

**Phase 2 — no questions.** Use the pattern 1.2 recommends, and keep verification on:
with nobody to opt out, Phase 3.5 runs after Patterns A–C, and the Ralph Loop pattern
runs its gates inside the loop. Compute the Phase 1.1 signals (`step_count`,
`parallelizable`, …) from every task **except the TT tasks** — the exclusion set is TT
only. `[infra]` tasks count: in Patterns A–C they run inside the pattern, and execution
order is not pattern choice. TTs run first whatever the pattern, so they are not a
signal. So an `[infra]` task plus one implementation task is `step_count = 2` with a
sequential dependency → Sequential Pipeline, as today. 1.2 reaches Ralph Loop only for
one implementation task and no `[infra]`: two tasks are either dependent (Sequential) or
independent (Parallel) before it is considered. Without the exclusion, the TTs —
parallel by construction — make `parallelizable >= 2` and every unattended spec falls to
Parallel Subagent. Record the pattern, the reason, and the counts the signals used (TTs
excluded) in the report instead of asking.

**Pattern D (Ralph Loop) in this mode — only for a spec with no TT tasks.** loop runs
the project's tests as its Gate 1 and may not modify a TT's file, so a TT that
over-specifies or does not exercise its requirement fails every iteration and ends the
run `escalated` before Phase 3.4 can judge the TT and have it rewritten — and
re-dispatch is not a recovery path for an escalation (below). So when the spec has TT
tasks and 1.2 recommends Ralph Loop, run that one implementation task as a Sequential
Pipeline instead, and say so in the report: the TTs go first, Phase 3.4 judges them
along with the code, and loop runs afterwards as Phase 3.5's verifier. A spec with no
TT tasks (from a specify run before TTs existed) keeps Pattern D.

Add to Pattern D's args: the marker, the spec path, and the parked scope listed under
Phase 3.5 below, with "do not implement parked tasks" as the parked-scope wording. Leave
out Phase 3.5's "implementation is already complete" framing, because here the loop
does the building. Without the unattended items, loop's contract approval, lesson
curation, and escalation would each wait for a person who isn't there.

Phase 3's "park and continue" does not apply inside Pattern D: loop treats fenced work
as a 🛑 STOP boundary and escalates, which ends the run as `escalated` with the green
work uncommitted. So before choosing Pattern D, park the tasks Phase 3 step 1 finds
(those marked `Fenced:` and their dependents) and pass only the rest to loop as the
scope. A worker that discovers an *unmarked* fence mid-loop
still escalates — that is the one case this mode cannot recover from, and the report
must say which task it was. If loop ends `escalated` — a boundary or no progress — run
no requirement check and no re-dispatch round: Phase 4 reports `escalated: {reason}` as
today. Re-dispatch is not a recovery path for an escalation.

**Phase 3 — park fenced work.**
1. Before executing, collect the tasks that carry a `Fenced:` field, then add every task
   that depends on one of them, directly or transitively. These tasks are **parked** and
   not executed. Three TT rules refine that walk (identification key above):
   - **An Rn with nobody left to implement it parks its TT.** When every implementation
     task that fulfills Rn is parked, TTn is parked too. A TT that ran anyway would leave
     red tests no task can turn green, and Phase 3.5's Gate 1 runs the project's whole
     test command, so those tests alone would end the run `escalated`.
   - **A TT's own park or failure does not propagate.** The `Depends on: TTn` edge is
     ordering-only — "run after TTn" — so the implementation tasks that depend on a
     parked, failed, or fenced TT still run (the TT step below says what is recorded).
     A transitive park that *reaches* a TT from a fenced non-TT ancestor still passes
     through it as usual: infra T1 fenced → TT2 parked → T3 (depends on TT2) parked.
   - **Parking an Rn after TTn has already run** — its implementation tasks become
     all-parked through a FENCED report, during the initial Phase 3 run or in a
     re-dispatch round — also means: remove the files listed in TTn's `gwt-tests.md`
     block and rewrite the block with no run line, every Rn GWT as `manual: parked`,
     and no files. Those GWTs leave the check scope, and Phase 4.2 re-measures every
     file `gwt-tests.md` lists, so a removed file left in the list would read as a
     tampered test. You are the orchestrator, not an implementation worker, so the
     "never modify a listed test file" rule does not bind you here.
2. Run the remaining tasks with the chosen pattern — TT tasks first, as the next
   subsection lays out. Before Phase 3 runs any task at all — a TT, an `[infra]` task,
   an implementation task, or the loop call of Pattern D; with TT tasks in the spec or
   without — and unless the run-identity check found this run's ledger, create
   `{specDir}/requirement-check.md` with its `spec: sha256 {hash}` line, its `head:
   {sha} on {branch}` line (HEAD guard), and one `task {id} parked — {reason}` line
   per task step 1 parked (§2). From then on, write every
   task event to the ledger the moment you learn it, in Phase 3 and in re-dispatch
   rounds alike: `task {id} parked — {reason}` for a FENCED report and for each
   dependent it parks (`depends on {id}`); `task {id} blocked {GWT} — {reason}` for
   each `BLOCKED:` line a worker returns; and, in Patterns A–C during Phase 3 only,
   `task {id} done` the moment an implementation task returns. `gwt-tests.md` is the
   TT record and these lines are everything else: a resume re-runs only the tasks with
   neither a `done` nor a `parked` line, and rebuilds the parked set and the BLOCKED
   GWTs from the file, never from memory. Without them a compaction mid-Phase 3 leaves
   you guessing between redoing finished work and skipping unfinished work, and sends a
   task that reported FENCED out again. Pattern D writes no `done` lines; loop's
   `progress.md` is its record.
3. Every worker prompt (subagent, team member, or your own step) includes: "If this task
   needs a change to a database schema, a migration that can lose data, auth /
   permission / access control, payment, or security (secrets, crypto), do not make it.
   Stop and report `FENCED: {area} — {what you found}`." A task that reports FENCED is
   parked with its dependents, and the run continues with the independent tasks — except
   a TT, which parks alone (step 1). In this mode every **implementation-worker** prompt,
   first dispatch or re-dispatch, any pattern, is the common prompt in §5: it carries
   this FENCED instruction, the `BLOCKED: {GWT id} — {reason}` report format ("cannot be
   met without changing the spec or a decision — report it and continue with the
   others"), "do not modify any test file listed in `gwt-tests.md`", and "run no git
   command that changes the index, a branch, or `HEAD`" — the snapshot check, the
   checker's changed-file list, and commit-on-green-only all assume nothing is staged or
   committed before Phase 4.2. On a first dispatch the "Unmet" block and the keep-green
   line are omitted. Initial workers must be able to report BLOCKED too: the check's
   "nothing to re-dispatch after round 0" exit depends on it. Keep every `BLOCKED:` line
   a worker returns — step 2 writes it to the ledger, and re-dispatch targeting reads it
   from there.
4. If nothing is left to run — at the start, or after FENCED reports — skip the rest of
   Phase 3, Phase 3.4 and Phase 3.5, record Verification as `skipped — all tasks parked`,
   and go to Phase 4.

**Phase 3 — run TT tasks first.**
1. **TTs are always separate subagent workers** (`capability:spawn-worker`), whatever
   the pattern — Sequential included: there you implement the tasks yourself, and if you
   also wrote the tests the maker and the checker would be one context. Never write a
   TT's tests yourself. Run them in DAG order: after the `[infra]` tasks they depend on
   (those run with the chosen pattern like any other task), every ready TT goes out in
   one message, in parallel; the implementation tasks that depend on them wait. A TT
   batch runs alone: start it once no other worker is in flight, and start no other
   worker until it returns, so everything that changes between its before and after
   snapshots (step 3) is the batch's doing. The prompt is §3, filled per TT. A spec
   with no TT tasks (from a specify run before TTs existed) skips this whole subsection
   and gets no `gwt-tests.md`.
2. **You write `gwt-tests.md`** (§1); a TT returns text and never touches the file.
   Unless the run-identity check found this run's copy, create `{specDir}/gwt-tests.md`
   with the `spec: sha256 {hash}` line (§2 "Run identity") and the R0 block — every R0
   GWT `manual: goal-level`, written by you, since R0 has no TT and so no return
   value — before the first TT is dispatched. Then, once a batch returns and step 3 is
   done, write one block per TT, in three moves:
   - **Check the return against the tree.** Every `test:` file appears under `files:`,
     and every listed file exists, starts with `tt{n}_`, and is a new untracked entry in
     the batch's snapshot diff. A return that fails either is a TT failure (step 5,
     reason `return does not match the files written`). A new file the return leaves
     out never reaches this point — step 3 has removed it — so every test file left in
     the tree has a recorded hash for the checker's `modified` code and Phase 4.2's
     guard.
   - **Format the listed files**, and only those, with the project's formatter and its
     lint autofix — `prettier --write`, `ruff format`, `black`, `gofmt -w`, whichever
     the project configures; none, skip this. Formatters are idempotent, so a later
     whole-tree format run — a worker's, or loop's Auto-fix in Phase 3.5 — leaves the
     files byte-identical. Hashed unformatted, the first such run would read as
     `modified` mid-round and as `requirements check failed` at Phase 4.2.
   - **Measure each file's hash yourself** with `shasum -a 256`, store its content
     with `git hash-object -w {file}`, and append the block with both (§1). A hash a
     worker returns is a claim, not evidence. The stored blob is the known-good copy:
     a listed file that is later changed or deleted is put back from it with `git
     cat-file blob {blob} > {file}` instead of having its TT rewritten.
   Writing per TT is what makes resume cheap: a TT that has a block is not re-run.
3. **Snapshot check, after every TT batch.** Right before a batch is dispatched, take
   `git status --porcelain -uall`, leaving out your own files — `requirement-check.md`
   and its `.tmp`, `gwt-tests.md`, and the report, which you write while results come
   in and which a repo that tracks `specs/` would show — and store every file it lists
   that exists with `git hash-object -w {file}`, keeping each sha: `-w` writes the
   content into the object store, so a file that already held earlier work can be put
   back without a commit. Record the index too, as `git write-tree` (a tree id of the
   index as it stands, written without touching it). `-uall` keeps a new test directory
   from collapsing into one `?? tests/` line that no basename would match. Right after
   the batch returns, run the HEAD guard, then take both snapshots again. A TT creates
   the new untracked files its return lists and nothing else, so every other difference
   is a rule break, whether the TT succeeded or not: a changed index tree (a `git add`,
   `git rm`, or `git mv`, in whichever status column it shows); a tracked file that was
   clean before and is listed now, in either column — ` M`, `M `, ` D`, `D `, and the
   rest; a new file no return in the batch lists — a shared `conftest.py`, a fixture
   directory, an `__init__.py`, an unlisted test file, or what a test run left behind,
   such as a `.pyc` under `__pycache__/` or a Jest snapshot; and a file listed before
   the batch whose content changed. The batch ran alone (step 1), so all of it is the
   batch's doing, and all of it is undone, index first: `git read-tree {tree}` puts the
   index back as it was — a file the TT staged is then unstaged, and one it added is
   untracked again — and only then `git checkout -- {file}` for a clean-before tracked
   file, which copies from the index just restored and so from `HEAD`, `git cat-file
   blob {sha} > {file}` for a file listed before (removal, if it did not exist then),
   and removal for a new file. Restoring the worktree first would copy a staged edit
   back out of the index. Write each to the ledger as `batch {TT ids} reverted {file}`
   (`index` for the index) and list it in the report.
4. **No test runner.** When nothing in `package.json` scripts, `Makefile`,
   `pyproject.toml`, or CI config defines a test command, the TT writes no files and
   returns every GWT as `manual: no test runner` (§3). Record the block as returned; the
   check then reads code for those GWTs, and the report's grounds ratio shows `read`
   100%, so the person sees how weak the evidence is.
5. **TT failure or FENCED.** On an error, a timeout, a `FENCED:` report, or a return
   that fails step 2's check, park that TT only and write `task TT{n} parked —
   {reason}`. Record every GWT of its Rn as `manual: TT failed — {reason}` or `manual: TT
   fenced — {reason}` (a block with no run line and no files), and run Rn's
   implementation tasks anyway: the edge is ordering-only (park step 1). Remove the
   files its return listed that are new entries of the batch's snapshot diff — never a
   file that existed before the batch, and never another TT's. Step 3 has already
   removed the files of a TT that returned nothing, and undone everything else.
6. **On resume**, re-run only the TTs that have neither a `gwt-tests.md` block nor a
   `parked` line. Before re-running one there is no "before" snapshot — compaction took
   it — so first remove every untracked (`??`) entry of `git status --porcelain -uall`
   whose basename starts with `tt{n}_`: TTs create new files only, so those are that
   TT's, left by a run that wrote files and was cut off before its block. Unprefixed
   debris cannot be told apart from finished work at that point; Phase 4.2's scope
   check is what catches it.

**Phase 3.4 — Requirement Check (unattended only).** Between Phase 3 and Phase 3.5: judge
every sub-requirement GWT of the spec, re-dispatch the tasks behind the unmet ones, and
judge again — the formats and prompts are §2, §4, and §5.
1. **When.** Only while Unattended Mode is active (the marker plus both Meta lines); the
   interactive path has no such phase. If park step 4 fired — nothing left to run,
   Verification `skipped — all tasks parked` — skip this phase too; the "zero unmet"
   exit below presumes at least one in-scope GWT. The moment Phase 3 execution ends
   (Patterns A–C finished; in Pattern D, loop returned without escalating), append the
   `phase3 complete` line to `{specDir}/requirement-check.md` first (§2; the file has
   existed since Phase 3 began).
2. **The check.** Spawn the checker as a fresh-context subagent
   (`capability:spawn-inline-checker`) with the §4 prompt and only the inputs it lists:
   the spec path; `gwt-tests.md`, or the line "no mapping — judge every GWT as read"
   when the spec has no TT tasks; the changed-file list — every path in `git status
   --porcelain -uall` but your own files (TT-first step 3), tracked modifications and
   untracked files alike, since nothing in this run is committed before Phase 4; never
   the workers' reports, which are claims,
   and a worker that omits a file it created would hide it from the check; the
   out-of-scope GWTs — those whose requirements only parked tasks fulfill, the same list
   Phase 3.5 receives; and the §4 prompt itself, whose numbered procedure is the
   checklist. Never the workers' reasoning or your own transcript. The checker runs the
   recorded test commands itself and fixes nothing. If the subagent capability is
   unavailable here (the subagent check after the branch guard normally catches this
   earlier; this is its fallback), stop before the check: write the report with
   Verification `requirements check failed — no subagent capability`, notify, run no
   Phase 3.5, commit nothing. Validate the returned lines against what you already
   know, not against shape alone:
   - **Parse.** Drop every line that matches neither §4 shape — a preamble, a blank, a
     closing remark. A separator is `—` or `–`, or `-` / `--` with whitespace on both
     sides; a hyphen inside a token (`does-not-exercise`, `wrong-expectation`,
     `test-fails`, `out-of-scope`, a hyphenated path) never is. Split a line at its first three separators only:
     everything after the third is `{grounds}`, free text that may contain anything.
   - **Coverage.** Exactly one line per in-scope GWT — a missing line and a duplicate
     alike fail the check. An `out-of-scope` line for an in-scope GWT fails it too: the
     out-of-scope set is yours, and the checker cannot grow it. A line for a GWT you
     listed out of scope is ignored whatever it says.
   - **Consistency.** Grounds must match the mapping — `test` only where it gives
     `test:`, `read` only where it gives `manual:` or nothing — and verdict, grounds,
     and code must pair as §4 assigns them: `met` only with `ok`, and `ok` only with
     `met`; `test-fails`, `does-not-exercise`, `wrong-expectation`, `over-specifies`,
     and `modified` only with `test`; `missing` only with `read`. Any other pairing fails the check: a
     verdict on the wrong evidence is no verdict, and a code that contradicts its
     verdict would drive targeting — removing a TT's files for a GWT counted met.
   An error and a timeout are failures too. Retry once with a new fresh-context checker;
   a second failure ends the run with `requirements check failed — {reason}` and no
   re-dispatch — a missing line is not an unmet verdict, and rebuilding on it would be
   groundless.
3. **Re-dispatch round.** Targets are the implementation tasks (identification key)
   whose `Fulfills` includes the requirement of an unmet GWT, minus the parked ones: if
   Rn is fulfilled by two tasks and one is parked, only the other is a target, and an
   unmet GWT whose fulfilling tasks are all parked adds nothing to the target count. A
   GWT a worker reported `BLOCKED` is excluded from targeting as well, for the rest of
   the run and for every task that fulfills its requirement — the block is between the
   GWT and the spec, not the task — so it too adds nothing to the target count; the
   checker still judges it every round, and its `met` is met. §5 states the same rule.
   Reason code `modified` (match the token, not the prose) means the tests were right
   and something changed them: put each listed file whose hash no longer matches back
   from its blob (TT-first step 2), write `task TT{n} restored {file}` to the ledger,
   and do not re-dispatch TTn — the implementation tasks of Rn are the targets, as for
   `test-fails`. Rewriting the tests now would spend a round on a cheap fix and write
   them after the code exists. Reason codes `does-not-exercise`, `wrong-expectation`,
   and `over-specifies` mean the test itself is wrong and make TTn the first target of
   the round; workers may not touch a listed test, so re-dispatching only the
   implementation would spend every round against a test no code can satisfy. Remove
   the files TTn's `gwt-tests.md` block lists (TTs create new files only, so a stale
   defective file would otherwise survive and run in Phase 3.5's Gate 1), re-dispatch
   TTn as a TT batch (§3 with the checker's lines for Rn appended; TT-first steps 1–3:
   it runs alone, its return is checked, its files are formatted and hashed), replace
   its block with the new one, and only then re-dispatch Rn's implementation tasks, so
   they build against the rewritten tests. A compaction anywhere in the round restarts
   the round (step 5).
   Implementation workers get the §5 prompt with the unmet GWTs (BLOCKED ones omitted)
   and the checker's lines for them. Every re-dispatch worker is a new subagent worker
   (`capability:spawn-worker`) whatever the pattern — same role, new instance; after
   Pattern D too, never a second loop call. Run the HEAD guard after each one returns. Several
   targets follow the original DAG: dependent tasks in order,
   independent ones (no `Depends on`, no file overlap) spawned in parallel in one
   message. A worker that reports FENCED mid-round parks its task and dependents (park
   step 1); if that leaves Rn with no unparked implementation task and TTn already ran,
   apply park step 1's third rule — remove TTn's files, park its block — and drop
   those GWTs from both sides of the next non-decrease comparison. After the round,
   re-run the full check over every in-scope GWT, never only the previously unmet ones:
   a regression the round introduced must count.
4. **Exit conditions**, evaluated in this order after every check, round 0 included:
   - no in-scope GWT left — a FENCED report mid-round parked every task that fulfills
     one → end with `skipped — all tasks parked`, as park step 4 does; "zero unmet"
     over an empty set would otherwise send a run that built nothing in scope to
     Phase 3.5 and a `passed` state;
   - unmet = 0 → Phase 3.5;
   - targets = 0 (every remaining unmet GWT is BLOCKED or all-parked) → end with
     `requirements unmet after N rounds`;
   - the unmet total did not decrease since the previous check, compared over the same
     GWT set (nothing to compare at round 0) → end with `requirements unmet after N
     rounds`;
   - N = 2 → end with `requirements unmet after N rounds`.
   N is the number of re-dispatch rounds actually run, so `requirements unmet after 0
   rounds` is a possible end. Neither `requirements unmet after N rounds` nor
   `requirements check failed — {reason}` ever claims success or commits; Phase 4
   carries both states.
5. **Ledger and resume** (§2). Every write to `requirement-check.md` is atomic: the
   whole new content to `requirement-check.md.tmp`, then rename. Besides the task
   events park step 2 lists: immediately before a round's workers are spawned, write
   `round N dispatched: {tasks}`; at round end, after the full recheck, write the
   round's verdict table with its unmet total, dispatched tasks, and BLOCKED lines; and
   once the run's Verification state is final, write `run ended at {sha}: {state}`
   (Phase 4.2 says when and what `{sha}` is). The pre-dispatch line exists because
   without it a compaction between dispatch and recheck restores N to its previous
   value and the same task goes out a third time. In both `gwt-tests.md` and the
   ledger, the line right under the `#` heading is `spec: sha256 {hash of spec.md}`,
   measured by you when you create the file (§2 "Run identity", the counterpart of
   loop's `contract_ref`); compare that line, never the heading. At the start of every
   run — right after the branch guard, before Phase 3 writes anything ("Run identity,
   before anything is written") — and on resume after compaction, recompute it before
   reading either file. A
   mismatch means the files are an earlier run's on a different spec: remove every test
   file the stale `gwt-tests.md` lists, delete both files, and start Phase 3 from the
   beginning. That includes a listed file that is tracked — committed by an earlier
   green run, but against the old spec. Left in place it would keep asserting the old
   behaviour under the project's test command, fail Gate 1 against code built to the
   new spec, and take the basename the new TT would choose; this run's TTs write the
   acceptance tests for every requirement afresh. Its deletion is part of this run's
   change: list each one in the report under "Acceptance tests from an earlier spec,
   removed", and Phase 4.2's scope check keeps those deletions staged. With a match, the
   HEAD guard runs first (a `run ended` line excepted — the due-commit rule reads `HEAD`
   itself), then the parked set and the BLOCKED GWTs
   come from the ledger's `task` lines, never from memory, and the ledger's state
   decides what happens next, the same way for a new invocation and for a resume after
   compaction:
   - `run ended at {sha}, commit due:` and `HEAD` still at `{sha}` → the run ended
     before its commit landed. Re-measure every file `gwt-tests.md` lists first, as
     Phase 4.2 does — a hook or a person may have changed one since. A mismatch
     rewrites the line as `run ended at {sha}: requirements check failed — TT file
     modified after the check: {files}`, updates the report to that state, and commits
     nothing; with every hash matching, run Phase 4.2's commit steps. Then notify;
   - any other `run ended` line → the run is over. Change nothing: notify that this
     spec's run already ended in that state, with the report path, the commit from `git
     log -1` when `HEAD` has moved, and how to run again (edit the spec, or run the
     reset the report gives — Phase 4 step 1), and stop. The ledger and `HEAD` decide this, never whether the tree is
     clean — a leftover file keeps a committed tree dirty;
   - no file, or no `phase3 complete` line → Phase 3 is still running: resume it as
     before (TTs per TT-first step 6, then the implementation tasks with neither a
     `done` nor a `parked` line; after Pattern D, re-invoke loop, which resumes from its
     own `progress.md`) and run no check — judging tasks that never ran as unmet would
     spend the two rounds on the first build;
   - `phase3 complete` and no round entry after it → round 0: run the full check;
   - the last round entry is a `round N dispatched` line with no `## round N` table
     after it → round N was cut off, and which of its workers ran is unknown. Run it
     again from the start: recompute its targets as step 3 does, from the last table
     and the ledger's `task` lines as they now stand, rewrite the `dispatched` line with
     them, and dispatch them all to new workers — a TT target is rewritten whether or
     not its block was already replaced, after its listed files and every untracked
     `tt{n}_` file are removed. Then run the full check as the end of round N. A check
     counted as the end of a round whose workers never ran would let the non-decrease
     exit end the run with rounds still allowed. Never resume a worker;
   - the last round entry is a `## round N` table, round 0's included → that check
     already ran on this tree: do not recheck. Evaluate the exit conditions from the
     table — its unmet total against the previous table's — and either write `round
     N+1 dispatched` and dispatch, or end. Compaction between a table write and the
     next `dispatched` line lands here; a second check would compare the tree with
     itself, find no decrease, and end the run while rounds were still allowed. When
     that table's unmet total is 0, the exit is Phase 3.5: re-invoke loop, which
     resumes from its own `progress.md`;
   - the last entry is `gate passed` with no `## gate recheck` table after it → the
     gate ended and its recheck was cut off: run Phase 3.5's recheck;
   - the last entry is a `## gate recheck` table → the recheck already ran: go to
     Phase 4 with the state it decided.
   Round entries are the `dispatched` lines, the tables, and the gate lines; `task`
   and `batch` lines between them do not change which state applies. On resume only
   round 0 and an interrupted gate recheck start with a full check: a cut-off round
   starts with its dispatch, a running Phase 3 is not ready to be judged, a recorded
   table is a check already run on that tree, and an ended run is not resumed except
   to land a due commit.

**Phase 3.5 — verification without a prompt.** The gate runs only after Phase 3.4 ended
with zero unmet in-scope GWTs; the check's other exits (`requirements unmet after N
rounds`, `requirements check failed — {reason}`) go straight to Phase 4 with no gate.
After Pattern D it runs only if at least one re-dispatch round happened: the round
changed the code after loop's embedded gates ran, so their verdict no longer describes
the tree, and loop is called again — this time as the verifier, with the framing, never
as the builder. With no round, Pattern D keeps `embedded in Loop pattern — see Loop
Report` (Rule 8). Invoke loop as in Phase 3.5 — its mandatory args, the "implementation
is already complete — start by verifying, do not redo the work" framing included, stay
as they are, and the check's verdicts are not pre-defined as gates — and add to the
args:
- `mode: unattended`;
- the spec path — loop's unattended-spec bypass reads that file's `## Meta` itself to
  skip its contract approval;
- the parked tasks and the requirements only they fulfill, marked out of scope: "verify
  only the work that ran; do not implement parked tasks". loop records this list in
  `loop.md`, so its Gate-3 checker and any resumed run see it too.
- the path of `gwt-tests.md`, when the spec has TT tasks;
- "do not modify any test file this file lists". Adding tests and refactoring are inside
  Auto-fix's boundary, so without this line it may edit a TT file, and the gate would
  pass against tests that are no longer the ones the check judged. This line keeps the
  "never modify a listed test file" constraint through the last phase that edits code,
  and the re-measured hashes — the recheck's step 1 and Phase 4.2 — are the evidence
  behind it: an instruction to loop is a claim, the hashes are not. The TT files were formatted before they were
  hashed (TT-first step 2), so loop's formatting Auto-fix leaves them byte-identical and
  only a real edit trips the comparison. Implementation code gets no such line — Auto-fix
  is allowed to change it — so the recheck below judges it again.

A loop escalation (an autonomy boundary, or no progress) ends the gate with
`escalated: {reason}`; loop notifies through its own unattended channel.

**Recheck after the gate.** A passed gate is not the end: loop's Auto-fix may still
have changed implementation code after Phase 3.4 judged it, and a GWT judged on `read`
grounds — every R0 GWT, every `manual:` GWT, every GWT when there is no test runner —
has no test in Gate 1 to catch a fix that broke it. So once loop returns with every
gate passed, run the HEAD guard, write `gate passed: {state}` to the ledger, then:
1. Re-measure every file `gwt-tests.md` lists. Put each one that no longer matches back
   from its blob (TT-first step 2), write `gate restored {file}` to the ledger, and list
   it in the report: the recheck must judge the tests that were judged before, not
   ones Auto-fix edited.
2. Run the full check once more over every in-scope GWT — Phase 3.4 step 2, with its
   validation and its one retry — and write its table to the ledger as `## gate
   recheck`. No re-dispatch follows: a regression here is the gate's doing, and
   another round would hand the code back to a builder after it was verified.
3. Every in-scope GWT `met` → Verification is the gate's state, and Phase 4 decides the
   commit. Any unmet → Verification `requirements unmet after the gate: {GWT ids}`,
   and nothing is committed. A checker failure after the retry → `requirements check
   failed — {reason}`.
After Pattern D with no re-dispatch round there is no Phase 3.5 and so no recheck:
Phase 3.4's check already ran after loop, the last thing that edited code.

**Phase 4 — report, commit, notify.** After the handoff, agent-orchestrate is the only
writer of the report; specify writes it only at its own stops, before handing off.
1. Settle the Verification state first: run step 2's green check, the hash re-measure
   included, before writing anything, so the report is written with the final state
   and its Result and next step match whether the run commits. Then write the Phase 4
   report to `{specDir}/unattended-report.md`, and add: the parked
   tasks with their reasons, the spec's `Status: assumed` decisions, the Spec Review
   verdict, the branch, and the next step for the person — for any run that did not
   commit, that step says how to run again: a re-run on an edited spec starts over on
   its own, and one on an unchanged spec stops at once because the ledger records that
   this run ended. To start over without editing the spec, the report gives the reset
   as one command — `rm` of every file `gwt-tests.md` lists that is still untracked,
   then of `gwt-tests.md` and `requirement-check.md`, with the paths filled in. Removing
   only the two ledger files would leave this run's TT files behind with no recorded
   hash: they would run in the next Gate 1, outside the hash guard, and Phase 4.2's
   scope check would quietly leave them out of the commit. Add every file TT-first step
   3 reverted, every file restored from its blob, and every acceptance test removed as
   written for an earlier spec. When Phase 3.4 ran, add its
   outcome: a per-GWT table from the last check — verdict, grounds kind (`test` or
   `read`), reason code, the round in which the GWT first became `met` (0 for the
   initial check; `—` while still unmet),
   and every `BLOCKED:` reason a worker returned; one line with the grounds ratio,
   `grounds: test n / read m` (`read` 100% means the check rested on code reading
   alone — no test runner, no TT tasks, or every TT failed — so the person sees how
   weak the evidence is); and a summary of `requirement-check.md` — the rounds run and
   the tasks each round dispatched. Copy the verdicts as the checker returned them
   (Rule 7).
2. **Commit on green only.** The run is green only when all four hold: no
   implementation task was parked — a TT parked by its own failure or FENCED report
   does not count, since its requirement was still built and judged on `read` grounds,
   which the report's grounds ratio shows; Phase 3.4 ended with every in-scope GWT met;
   the verification state is
   `passed (N iterations)` with the recheck after the gate finding every in-scope GWT
   met — or, for a Pattern D run with no re-dispatch round,
   `embedded in Loop pattern` with a Loop Report verdict of all gates passed; `HEAD`
   and the branch still match the ledger's `head:` line (HEAD guard); and every
   file `gwt-tests.md` lists still matches its recorded hash — re-measure each with
   `shasum -a 256` now, after Phase 3.5, the last phase that edits code. A mismatch
   means the acceptance tests the check judged are not the ones in the tree: set
   Verification to `requirements check failed — TT file modified after the check:
   {files}`, leave everything uncommitted, and name the files in the report. A run that
   never reached a completed check is not green whatever loop reported: a Pattern D run
   whose gates all passed but that ended `requirements check failed — {reason}` stays
   uncommitted. The state is now final, green or not: write `run ended at {sha}:
   {Verification state}` to the ledger, when there is one, before any commit command —
   `{sha}` is `git rev-parse HEAD` at that moment, and a green run writes `run ended at
   {sha}, commit due: {state}`. A re-invocation on the same spec, or a resume after
   compaction, then neither re-enters Phase 3.5 nor re-runs the check, and the sha
   tells it whether a due commit landed: `HEAD` still at `{sha}` means it did not
   (Phase 3.4 step 5). The Phase 3.4 no-subagent fallback, which writes its report
   directly, writes the same line before its notification. Then, on green, commit on
   the current branch:
   1. Re-run the branch guard, and write "Commit: on `{branch}`, see `git log -1`"
      into the report first.
   2. `git add -A`, then `git add -f {specDir}/unattended-report.md` — `specs/` is
      gitignored in many repos (it is in this one), so without `-f` the report, the
      spec, `loop.md`, and `progress.md` are silently left out of the commit. The
      report is the only one of these forced in; the rest follow the repo's ignore
      rules.
   3. Confirm the scope: `git status --short` and compare the staged set with the
      files the spec's tasks name, the files `gwt-tests.md` lists, the deletions of
      acceptance tests written for an earlier spec (Phase 3.4 step 5), and the report.
      The second set is the acceptance tests: a TT task names no file, because a TT
      picks its file names at run time. Unstage anything else — a stray scratch file, a debug
      script, a worker's temp output — with `git restore --staged` and list it in the
      report under "Left uncommitted". Nobody is watching this staging, so the check is
      the only review it gets.
   4. Write the message to `$(git rev-parse --git-dir)/unattended-commit-msg.txt` (a
      Conventional Commits subject from the spec's goal, the task list in the body, and
      the attribution trailers the session provides), and `git commit -F` that file.
   5. Verify the message: diff `git log -1 --format=%B` against that file with blank
      lines and trailing whitespace normalised on both sides. A `<` line (text missing
      from the commit) is a failure; `>` lines alone are a `commit-msg` hook appending
      and pass.
   If the commit or the verification fails, replace the "Commit:" line in the report
   with the error. Never push, never merge, never commit on the default branch. In
   every other state leave the changes uncommitted so the person reviews the diff.
3. Send a `PushNotification` with one line: the verification state, done / parked counts,
   the unmet GWT count from the last check (0 when every in-scope GWT was met; omitted
   when no check ran), the commit sha if there is one, and the report path. If
   `PushNotification` is unavailable, the report file is the record. (A loop escalation
   also sends loop's own notification first.)

---

## Rules

1. **Always ask before executing** — never skip Phase 2 confirmation. The one exception is Unattended Mode, which only a spec from an unattended specify run can enter
2. **Ralph Loop is a skill call, not a reimplementation** — use `Skill(skill="harness-ops:loop")` (`capability:invoke-skill`; under agy, load `../loop/SKILL.md` inline)
3. **Parallel agents in one message** — don't spawn sequentially
4. **Match pattern to situation** — don't force a pattern; if the task is trivial, sequential is fine
5. **Pass context forward** — each step/agent needs enough context to work independently
6. **Keep proposals concise** — the user wants a recommendation, not an essay
7. **Relay the verification verdict as-is** — never fabricate or soften a failing verdict into success
8. **The verification gate never runs twice on the same code state** — the Ralph Loop pattern embeds it; Phase 3.5 skips in that case unless a re-dispatch round changed the code (Unattended Mode)
9. **Disclose auto-fix in Phase 2** — the preview must state that the gate modifies code on failure, not just reports
10. **Checker reports, workers build** — in Unattended Mode the requirement checker never edits code, tests, or the spec, and implementation workers never modify a test file listed in `gwt-tests.md` (maker ≠ checker)

