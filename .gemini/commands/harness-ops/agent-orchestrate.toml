# /agent-orchestrate — Situation-Aware Agent Orchestration

Analyze the user's task, recommend the best orchestration pattern, and execute it upon approval.

---

## 4 Orchestration Patterns

| Pattern | When | Mechanism | Best For |
|---------|------|-----------|----------|
| **Sequential Pipeline** | Steps depend on each other (A→B→C) | TaskCreate → execute one by one | Blog writing, migration, ordered workflows |
| **Parallel Subagent** | N independent tasks, results merged | Agent × N spawn → main collects | Competitor analysis, multi-file review, bulk processing |
| **Team Mode** | Roles need inter-agent communication | TeamCreate → agents talk directly | Design+implement+review, complex features |
| **Ralph Loop** | Clear done-criteria, iterative refinement | Activate `harness-ops:loop` with a gate contract | Bug fixing to spec, quality gates, polish tasks |

---

## Phase 1: Task Analysis

When the user provides a task (as argument or in conversation):

### 1.1 Extract Signal

Read the task description and identify:

```
signals = {
  step_count:      how many distinct steps/subtasks?
  dependencies:    are steps dependent (A→B) or independent (A∥B)?
  parallelizable:  how many tasks can run simultaneously?
  roles_needed:    does the task need distinct roles (designer, implementer, reviewer)?
  inter_comm:      do workers need to communicate with each other mid-task?
  done_criteria:   is there a clear, binary definition of done?
  iterative:       does the task likely need multiple passes to get right?
  verification_source: where did the done-criteria come from?
                   `spec ({path})`            — the task args reference a spec.md path (e.g. specs/*/spec.md)
                   `done-criteria ({summary})` — the user stated explicit, measurable completion criteria
                                                 (e.g. "all tests pass", "p95 under 200ms")
                   `none`                      — neither of the above
}
```

### 1.2 Pattern Selection Logic

The key insight: check structural signals (parallelism, roles) first, then refinement signals (iteration).
Ralph is for tasks where the *primary challenge* is "getting it right" through iteration, not for any task that happens to have success criteria.

```
recommend_pattern =
  IF parallelizable >= 2 AND no inter_comm needed:
    "Parallel Subagent"
  ELIF roles_needed >= 2 AND inter_comm needed:
    "Team Mode"
  ELIF step_count >= 2 AND all dependencies are sequential (A→B→C):
    "Sequential Pipeline"
  ELIF done_criteria is clear AND iterative AND step_count <= 2:
    "Ralph Loop"
  ELIF step_count == 1:
    "Sequential Pipeline"  # simplest default for single task
  ELSE:
    "Parallel Subagent"    # safe default for multi-task
```

**Why Ralph is checked later**: Most multi-step tasks benefit from structural parallelism even if they have clear done-criteria. Ralph shines when the task is focused (1-2 subtasks) but needs iterative refinement to meet quality — e.g., "fix this bug until tests pass", "bring latency under 200ms".

---

## Phase 2: Propose to User

> In **Unattended Mode** (see `## Unattended Mode` below) both questions in this phase
> are skipped: the recommended pattern is used and the verification gate stays on.

Present the recommendation using AskUserQuestion. Include:

1. **Why this pattern** — 1-2 sentence reasoning based on signals
2. **Execution plan preview** — what agents/tasks will be created
3. **All 4 options** — let the user override

### AskUserQuestion Format

```
question: "I recommend the '{recommended}' pattern for this task. {reason}. Which pattern would you like to use?"
header: "Pattern"
options:
  - label: "{recommended} (Recommended)"
    description: "{why this fits}"
  - label: "{2nd best}"
    description: "{when this would be better}"
  - label: "{3rd}"
    description: "{description}"
  - label: "{4th}"
    description: "{description}"
```

After pattern selection, present the execution plan preview:

```
question: "Here is the execution plan. Proceed?"
header: "Confirm"
options:
  - label: "Proceed"
    description: "{plan summary}"
  - label: "Revise then proceed"
    description: "I want to adjust the plan"
```

**If "Revise then proceed" is selected**: Ask "What would you like to change?" as an open question via AskUserQuestion. Incorporate the user's feedback, reconstruct the execution plan, then re-present the confirmation. If the user wants to change the pattern itself, return to the pattern selection step in Phase 2.

### Verification Gate Disclosure

When `verification_source != none` AND the selected pattern is **not** Ralph Loop, the execution plan preview MUST state all three of the following:

1. **Gate exists** — after execution, a verification gate will run via the `harness-ops:loop` skill against the spec / done-criteria.
2. **Gate auto-fixes** — if the gate fails, the loop will **modify code** within its Auto-fix autonomy boundary. It is not report-only.
3. **Opt-out** — the user can exclude the verification gate via "Revise then proceed".

If the user opts out of verification this way, Phase 3.5 is skipped and the Phase 4 Verification field records `declined — user opted out at Phase 2`.

---

## Phase 3: Execute by Pattern

### Pattern A: Sequential Pipeline

```
1. Parse task into ordered steps
2. FOR each step:
     TaskCreate(title=step.name, description=step.detail)
3. FOR each task in order:
     Execute the task directly (read, write, bash, etc.)
     TaskUpdate(status="completed")
4. Output: summary of all completed steps
```

**Key rule**: Each task must complete before the next begins. Pass outputs forward as context.

### Pattern B: Parallel Subagent

```
1. Parse task into independent subtasks
2. Spawn Agent per subtask (all in ONE message for true parallelism):
   Agent(
     description="subtask summary",
     prompt="full context + specific subtask + output format",
     subagent_type=<appropriate type or general-purpose>
   )
3. Collect all agent results
4. Synthesize/merge results into final output
5. Present unified result to user
```

**Key rule**: All agents must be spawned in a single message. The main agent does the synthesis — never delegate merging to a subagent.

### Pattern C: Team Mode

```
1. Define roles from task analysis (e.g., designer, implementer, reviewer)
2. TeamCreate with role-based agents:
   TeamCreate(
     agents=[
       {name: "role-1", description: "...", tools: [...]},
       {name: "role-2", description: "...", tools: [...]}
     ]
   )
3. Orchestrate via SendMessage:
   - Kick off first role's work
   - Route outputs between roles
   - Coordinate handoffs
4. TeamDelete when complete
5. Present final result
```

**Key rule**: Define clear handoff points. The orchestrator (you) coordinates — agents talk through you or directly via SendMessage.

### Pattern D: Ralph Loop

**Do NOT reimplement the loop.** Activate the `harness-ops:loop` skill, which owns the gate contract + verification machinery.

```
1. Formulate the task as a loop request:
   - Clear goal statement
   - Any done-criteria / thresholds the user provided
2. Invoke: Skill(skill="harness-ops:loop", args="{task description with context}")
3. The loop skill handles the rest:
   - Phase 0: gate contract (loop.md) proposal + user confirmation
   - Phase 1-3: Work → Verify (3 gates) → Fix, until gates pass or a boundary escalates
   - Phase 4: evidence report
```

**Key rule**: Pass through all relevant context (file paths, requirements, constraints) in the args so the loop has the full picture. Do not pre-define the gates — let the loop skill propose the contract.

In Unattended Mode, add the unattended args too — see `## Unattended Mode` › Pattern D.

---

## Phase 3.5: Verification Gate

specify's L4 omits a final-verify task because "holistic verification is handled in the execute pipeline" — this phase is that verification.

### When to Run

| Condition | Action |
|-----------|--------|
| Unattended Mode — any pattern | See `## Unattended Mode` › Phase 3.5: run only after Phase 3.4 ends with zero unmet in-scope GWTs; after Pattern D, only if a re-dispatch round changed the code — otherwise Pattern D keeps `embedded in Loop pattern — see Loop Report` |
| Ralph Loop pattern was executed | Skip — report `embedded in Loop pattern — see Loop Report` (the gates already ran inside the pattern) |
| `verification_source: none` | Skip — report `skipped — no spec/done-criteria` |
| User opted out at Phase 2 | Skip — report `declined — user opted out at Phase 2` |
| Otherwise (non-Loop pattern + `verification_source` present) | Run the gate |

### How to Run the Gate

Invoke `Skill(skill="harness-ops:loop", args=...)`. The args MUST include:

1. The spec path (or the done-criteria)
2. Context of what was just executed — which tasks, which files
3. The explicit framing: **"implementation is already complete — start by verifying, do not redo the work"** (the loop's cycle starts at WORK; this framing makes iteration 1's work a no-op so VERIFY is effectively the first action)
4. Direction that the `loop.md` contract lives in the spec directory

The args must NOT pre-define the concrete gates — loop's Phase 0 owns gate derivation and contract approval (same ownership rule as Pattern D).

In Unattended Mode, add the marker, the parked scope, and the `gwt-tests.md` items to the args — see `## Unattended Mode` › Phase 3.5.

### Failure Handling

- **User rejects the contract at loop's Phase 0** → record `aborted — contract rejected at Phase 0`. Verification is honestly recorded as not performed — never as passed.
- **The Skill invocation itself errors** → relay the error in the report and suggest running `/harness-ops:loop` manually with the spec path.

---

## Phase 4: Report

After execution completes (regardless of pattern), output a brief summary:

```markdown
## Orchestration Complete

**Pattern**: {chosen pattern}
**Tasks**: {count} completed
**Result**: {1-3 sentence summary of what was done}
**Verification**: {one of the states below}
```

**Verification** is mandatory and must be exactly one of:

| State | Meaning |
|-------|---------|
| `passed (N iterations)` | All loop gates passed — attach a brief Evidence Report summary |
| `escalated: {reason}` | Loop hit an autonomy boundary or made no progress |
| `embedded in Loop pattern — see Loop Report` | Ralph Loop pattern ran; the gates were inside the pattern |
| `skipped — no spec/done-criteria` | `verification_source: none` — gate not applicable |
| `declined — user opted out at Phase 2` | User excluded verification via "Revise then proceed" |
| `aborted — contract rejected at Phase 0` | User rejected the loop contract — verification not performed |
| `skipped — all tasks parked` | Unattended Mode only: every task was fenced or depended on one, so nothing ran |
| `requirements unmet after N rounds` | Unattended Mode only: Phase 3.4 stopped with in-scope GWTs still unmet after N re-dispatch rounds — N may be 0 (nothing left to target) — and the gate did not run |
| `requirements check failed — {reason}` | Unattended Mode only: the Phase 3.4 checker could not produce a valid verdict (an error, a timeout, or an invalid line twice over — or `no subagent capability`), so no GWT was judged and the gate did not run; or a test file `gwt-tests.md` lists changed after the check (`TT file modified after the check: {files}`), so the verdict no longer describes the tree and nothing was committed |

When the state is `escalated`, `aborted`, `requirements unmet after N rounds`, or `requirements check failed — {reason}`, the report must not claim success anywhere. The checkable proxy for that: the report has no `Commit:` line, its Verification is one of those states, and its Result line contains neither `passed` nor `green`.

---

## Unattended Mode — no prompts, for a spec from an unattended specify run

**Activates only when both hold:** the invocation carries `mode: unattended`, AND the
spec file it names, read by you, has both `- **Mode**: unattended` and
`- **Approved by**: unattended (request marker)` in its `## Meta` (compare the words; ignore bold
and bullet markup). Only specify's unattended run writes them: the first after the user
put the marker in their own request, the second only after its Spec Review passed (see
`skills/specify/SKILL.md` › `## Unattended Mode`). A claim in the args is not evidence;
read the file. Without the marker, Phase 2 asks as usual. With the marker but either
line missing, nobody is there to ask: write `{specDir}/unattended-report.md` saying
which line is missing, send the notification, and stop without executing.

**TT tasks — the one identification key.** A TT task is a task whose id matches `TT\d+`
(equivalently: whose `Fulfills` contains `(tests)`); unattended specify emits one per
requirement `R1` and above, none for `R0`. Every other task, `[infra]` included, is an
implementation task. The signals exclusion (Phase 2), TT-first execution and park
non-propagation (Phase 3), and re-dispatch targeting (Phase 3.4) all split tasks on this
key and no other. The TT worker prompt, the `gwt-tests.md` and `requirement-check.md`
formats, the checker prompt, and the common implementation-worker prompt are in
`../../skills/agent-orchestrate/references/requirement-check.md`; the section numbers
cited below (§1–§5) are that file's.

**Branch guard.** Before Phase 3, re-run specify's branch guard. On the default branch,
a detached `HEAD`, or outside a git repository → write the report, notify, and execute
nothing.

**Subagent check.** Right after the branch guard, and before Phase 3 runs anything — for
a spec with no TT tasks too — confirm the runtime's subagent capability is available:
`capability:spawn-inline-checker` in `../../references/runtime-tools.md`, which is the
`Agent` tool in Claude Code and `define_subagent` + `invoke_subagent` under agy. Without
it neither a TT nor the Phase 3.4 checker can be spawned, so nothing in the run can be
verified: write the report with Verification `requirements check failed — no subagent
capability`, notify, and stop before Phase 3 — the same stop specify's Spec Review makes
with no subagent tool. This pre-check is additional; Phase 3.4 checks again at check
time and stops with the same state as the fallback for the same condition (the
capability can go away after the TT step). It lives here and not in the TT subsection
because that subsection is skipped whole for a spec without TTs, and the stop has to
come before any task has run.

**Phase 2 — no questions.** Use the pattern 1.2 recommends, and keep verification on:
with nobody to opt out, Phase 3.5 runs after Patterns A–C, and the Ralph Loop pattern
runs its gates inside the loop. Compute the Phase 1.1 signals (`step_count`,
`parallelizable`, …) from every task **except the TT tasks** — the exclusion set is TT
only. `[infra]` tasks count: in Patterns A–C they run inside the pattern, and execution
order is not pattern choice. TTs run first whatever the pattern, so they are not a
signal. So an `[infra]` task plus one implementation task is `step_count = 2` with a
sequential dependency → Sequential Pipeline, as today; Pattern D arises only for a spec
with no `[infra]` and at most 2 implementation tasks. Without the exclusion, the TTs —
parallel by construction — make `parallelizable >= 2` and every unattended spec falls to
Parallel Subagent. Record the pattern, the reason, and the counts the signals used (TTs
excluded) in the report instead of asking.

**Pattern D (Ralph Loop) in this mode.** loop takes the whole scope and spawns no
per-task agent, so "a TT is always a separate `Agent`" needs its own order here. After
the park step, run the TT tasks — and the `[infra]` tasks they depend on — first, as
`Agent` workers in DAG order, writing `gwt-tests.md` as each TT finishes (see "run TT
tasks first" below). Then hand **only the remaining tasks** to loop as the scope. Those
`[infra]` tasks still count in the Phase 2 signals: running them ahead of loop is
execution order, not pattern choice.

Add to Pattern D's args: the marker, the spec path, and the parked scope listed under
Phase 3.5 below, with "do not implement parked tasks" as the parked-scope wording; when
the spec has TT tasks, the path of `gwt-tests.md` and "do not modify any test file this
file lists" — loop's
Auto-fix covers adding tests and refactoring, and without the instruction it may touch a
TT's file; and "these tests are expected to fail until their requirement is implemented —
implement the whole scope in the first WORK, then VERIFY". The last line is there
because the TTs leave red tests behind and loop's Gate 1 is one project test command: a
first VERIFY against a half-built scope finds failing tests that no Auto-fix covers, and
loop escalates at once. Pattern D is chosen for 1–2 tasks, so one WORK normally covers
the scope; a scope too large for that ends the run `escalated` the same way. Leave out
Phase 3.5's "implementation is already complete" framing, because here the loop does
the building. Without the unattended items, loop's contract approval, lesson curation,
and escalation would each wait for a person who isn't there.

Phase 3's "park and continue" does not apply inside Pattern D: loop treats fenced work
as a 🛑 STOP boundary and escalates, which ends the run as `escalated` with the green
work uncommitted. So before choosing Pattern D, park the tasks Phase 3 step 1 finds
(those marked `Fenced:` and their dependents, with the TT rules given there) and pass
only the rest to loop as the scope. A worker that discovers an *unmarked* fence mid-loop
still escalates — that is the one case this mode cannot recover from, and the report
must say which task it was. If loop ends `escalated` — a boundary or no progress — run
no requirement check and no re-dispatch round: Phase 4 reports `escalated: {reason}` as
today. Re-dispatch is not a recovery path for an escalation.

**Phase 3 — park fenced work.**
1. Before executing, collect the tasks that carry a `Fenced:` field, then add every task
   that depends on one of them, directly or transitively. These tasks are **parked** and
   not executed. Three TT rules refine that walk (identification key above):
   - **An Rn with nobody left to implement it parks its TT.** When every implementation
     task that fulfills Rn is parked, TTn is parked too. A TT that ran anyway would leave
     red tests no task can turn green, and Phase 3.5's Gate 1 runs the project's whole
     test command, so those tests alone would end the run `escalated`.
   - **A TT's own park or failure does not propagate.** The `Depends on: TTn` edge is
     ordering-only — "run after TTn" — so the implementation tasks that depend on a
     parked, failed, or fenced TT still run (the TT step below says what is recorded).
     A transitive park that *reaches* a TT from a fenced non-TT ancestor still passes
     through it as usual: infra T1 fenced → TT2 parked → T3 (depends on TT2) parked.
   - **Parking an Rn after TTn has already run** — its implementation tasks become
     all-parked through a FENCED report, during the initial Phase 3 run or in a
     re-dispatch round — also means: remove the files listed in TTn's `gwt-tests.md`
     block and rewrite Rn's GWT entries in that file as `manual: parked`. Those GWTs
     leave the check scope. You are the orchestrator, not an implementation worker, so
     the "never modify a listed test file" rule does not bind you here.
2. Run the remaining tasks with the chosen pattern — TT tasks first, as the next
   subsection lays out. Before the first of them runs, create
   `{specDir}/requirement-check.md` with its `spec: sha256 {hash}` line (§2), and in
   Patterns A–C append `task {id} done` the moment each implementation task returns:
   `gwt-tests.md` is the TT record, these lines are the implementation record, and a
   resume re-runs only the tasks without one. Without them a compaction mid-Phase 3
   leaves you guessing between redoing finished work and skipping unfinished work.
   Pattern D writes none; loop's `progress.md` is its record.
3. Every worker prompt (subagent, team member, or your own step) includes: "If this task
   needs a change to a database schema, a migration that can lose data, auth /
   permission / access control, payment, or security (secrets, crypto), do not make it.
   Stop and report `FENCED: {area} — {what you found}`." A task that reports FENCED is
   parked with its dependents, and the run continues with the independent tasks — except
   a TT, which parks alone (step 1). In this mode every **implementation-worker** prompt,
   first dispatch or re-dispatch, any pattern, is the common prompt in §5: it carries
   this FENCED instruction, the `BLOCKED: {GWT id} — {reason}` report format ("cannot be
   met without changing the spec or a decision — report it and continue with the
   others"), and "do not modify any test file listed in `gwt-tests.md`"; on a first
   dispatch the "Unmet" block and the keep-green line are omitted. Initial workers must
   be able to report BLOCKED too: the check's "nothing to re-dispatch after round 0" exit
   depends on it. Keep every `BLOCKED:` line a worker returns — the check reads them.
4. If nothing is left to run — at the start, or after FENCED reports — skip the rest of
   Phase 3, Phase 3.4 and Phase 3.5, record Verification as `skipped — all tasks parked`,
   and go to Phase 4.

**Phase 3 — run TT tasks first.**
1. **TTs are always separate subagent workers** (`capability:spawn-inline-checker`),
   whatever the pattern — Sequential
   included: there you implement the tasks yourself, and if you also wrote the tests the
   maker and the checker would be one context. Never write a TT's tests yourself. Run
   them in DAG order: after the `[infra]` tasks they depend on (those run with the chosen
   pattern like any other task), every ready TT goes out in one message, in parallel; the
   implementation tasks that depend on them wait. The prompt is §3, filled per TT. A spec
   with no TT tasks (from a specify run before TTs existed) skips this whole subsection
   and gets no `gwt-tests.md`.
2. **You write `gwt-tests.md`** (§1); a TT returns text and never touches the file.
   Create `{specDir}/gwt-tests.md` with the `spec: sha256 {hash}` line (§2 "Run
   identity") and the R0 block — every R0 GWT `manual: goal-level`, written by you,
   since R0 has no TT and so no return value — before the first TT is dispatched, then
   append one block as each TT finishes, measuring each listed file's
   hash yourself with `shasum -a 256`. A hash a worker returns is a claim, not evidence.
   Writing per TT is what makes resume cheap: a TT that has a block is not re-run.
3. **No test runner.** When nothing in `package.json` scripts, `Makefile`,
   `pyproject.toml`, or CI config defines a test command, the TT writes no files and
   returns every GWT as `manual: no test runner` (§3). Record the block as returned; the
   check then reads code for those GWTs, and the report's grounds ratio shows `read`
   100%, so the person sees how weak the evidence is.
4. **TT failure or FENCED.** On an error, a timeout, or a `FENCED:` report, park that
   TT only. Record every GWT of its Rn as `manual: TT failed — {reason}` or `manual: TT
   fenced — {reason}` (a block with no run line and no files), and run Rn's
   implementation tasks anyway: the edge is ordering-only (park step 1). The TT returned
   no file list, so clean up from the `git status --porcelain -uall` snapshots you take
   before and after each TT: remove only the **new** entries whose basename starts with
   `tt{n}_`. The prefix keeps a parallel sibling's files safe — never remove another TT's
   files from the same batch — and `-uall` keeps a new test directory from collapsing
   into one `?? tests/` line that no basename would match. Compare the whole snapshots
   too, for every TT, succeeded or not — a returned file list is a claim: a tracked file
   that was clean before and shows ` M` after is a rule break, since a TT never edits an
   existing file. If no other worker ran between the two snapshots, restore it with
   `git checkout -- {file}`; if a parallel batch was running the change cannot be
   attributed, so leave it and list the file in the report under `possibly modified by
   TT{n}` — Phase 4.2's scope check sees it again before anything is committed.
5. **On resume**, re-run only the TTs that have no `gwt-tests.md` block. Before re-running
   one there is no "before" snapshot — compaction took it — so first remove every
   untracked (`??`) entry of `git status --porcelain -uall` whose basename starts with
   `tt{n}_`: TTs create new files only, so those are that TT's, left by a run that wrote
   files and was cut off before its block.

**Phase 3.4 — Requirement Check (unattended only).** Between Phase 3 and Phase 3.5: judge
every sub-requirement GWT of the spec, re-dispatch the tasks behind the unmet ones, and
judge again — the formats and prompts are §2, §4, and §5.
1. **When.** Only while Unattended Mode is active (the marker plus both Meta lines); the
   interactive path has no such phase. If park step 4 fired — nothing left to run,
   Verification `skipped — all tasks parked` — skip this phase too; the "zero unmet"
   exit below presumes at least one in-scope GWT. The moment Phase 3 execution ends
   (Patterns A–C finished; in Pattern D, loop returned without escalating), append the
   `phase3 complete` line to `{specDir}/requirement-check.md` first (§2; the file has
   existed since Phase 3 began).
2. **The check.** Spawn the checker as a fresh-context subagent
   (`capability:spawn-inline-checker`) with the §4 prompt and only the inputs it lists:
   the spec path; `gwt-tests.md`, or the line "no mapping — judge every GWT as read"
   when the spec has no TT tasks; the changed-file list — every path in `git status
   --porcelain -uall`, tracked modifications and untracked files alike, since nothing in
   this run is committed before Phase 4; never the workers' reports, which are claims,
   and a worker that omits a file it created would hide it from the check; the
   out-of-scope GWTs — those whose requirements only parked tasks fulfill, the same list
   Phase 3.5 receives; and the §4 prompt itself, whose numbered procedure is the
   checklist. Never the workers' reasoning or your own transcript. The checker runs the
   recorded test commands itself and fixes nothing. If the subagent capability is
   unavailable here (the subagent check after the branch guard normally catches this
   earlier; this is its fallback), stop before the check: write the report with
   Verification `requirements check failed — no subagent capability`, notify, run no
   Phase 3.5, commit nothing. Validate the returned lines against what you already
   know, not against shape alone. First drop every line that matches neither §4 shape —
   a preamble, a blank, a closing remark — and read the separators loosely: `—`, `–`,
   `-`, `--`, any spacing. Then, over the lines that do match: exactly one line per
   in-scope GWT, or the check fails — a missing line and a duplicate alike; an
   `out-of-scope` line for an in-scope GWT is a checker failure, not an exclusion — the
   out-of-scope set is yours and the checker cannot grow it; grounds `test` on a GWT
   whose mapping is `manual:` or absent, or grounds `read` on a GWT whose mapping is
   `test:`, is a checker failure — the procedure was not followed, and a verdict on the
   wrong evidence is no verdict; a line for a GWT you listed out of scope is ignored
   whatever it says. An error and a timeout are failures too. Retry once with a new
   fresh-context checker; a second failure ends the run with `requirements check failed
   — {reason}` and no re-dispatch — a missing line is not an unmet verdict, and
   rebuilding on it would be groundless.
3. **Re-dispatch round.** Targets are the implementation tasks (identification key)
   whose `Fulfills` includes the requirement of an unmet GWT, minus the parked ones: if
   Rn is fulfilled by two tasks and one is parked, only the other is a target, and an
   unmet GWT whose fulfilling tasks are all parked adds nothing to the target count. A
   GWT a worker reported `BLOCKED` is excluded from targeting as well, for the rest of
   the run and for every task that fulfills its requirement — the block is between the
   GWT and the spec, not the task — so it too adds nothing to the target count; the
   checker still judges it every round, and its `met` is met. §5 states the same rule.
   Reason codes `does-not-exercise`, `over-specifies`, and `modified` (match the token,
   not the prose) make TTn the first target of the round: remove the files listed in
   TTn's current `gwt-tests.md` block — TTs create new files only, so a stale defective
   or tampered file would otherwise survive and run in Phase 3.5's Gate 1 — re-dispatch
   TTn (§3, with the checker's lines appended), replace its block with freshly measured
   hashes, and only then re-dispatch Rn's implementation tasks, so they build against
   the rewritten tests. Implementation workers get the §5 prompt with the unmet GWTs
   (BLOCKED ones omitted) and the checker's lines for them. Every re-dispatch worker
   is a new subagent worker (`capability:spawn-inline-checker`) whatever the pattern —
   same role, new instance; after Pattern D too, never a second loop call. Several
   targets follow the original DAG: dependent tasks in order,
   independent ones (no `Depends on`, no file overlap) spawned in parallel in one
   message. A worker that reports FENCED mid-round parks its task and dependents (park
   step 1); if that leaves Rn with no unparked implementation task and TTn already ran,
   apply park step 1's third rule — remove TTn's files, `manual: parked` — and drop
   those GWTs from both sides of the next non-decrease comparison. After the round,
   re-run the full check over every in-scope GWT, never only the previously unmet ones:
   a regression the round introduced must count.
4. **Exit conditions**, evaluated in this order after every check, round 0 included:
   - unmet = 0 → Phase 3.5;
   - targets = 0 (every remaining unmet GWT is BLOCKED or all-parked) → end with
     `requirements unmet after N rounds`;
   - the unmet total did not decrease since the previous check, compared over the same
     GWT set (nothing to compare at round 0) → end with `requirements unmet after N
     rounds`;
   - N = 2 → end with `requirements unmet after N rounds`.
   N is the number of re-dispatch rounds actually run, so `requirements unmet after 0
   rounds` is a possible end. Neither `requirements unmet after N rounds` nor
   `requirements check failed — {reason}` ever claims success or commits; Phase 4
   carries both states.
5. **Ledger and resume** (§2). Every write to `requirement-check.md` is atomic: the
   whole new content to `requirement-check.md.tmp`, then rename. Immediately before a
   round's workers are spawned, write `round N dispatched: {tasks}`; at round end, after
   the full recheck, write the round's verdict table with its unmet total, dispatched
   tasks, and the workers' `BLOCKED:` lines. The pre-dispatch line exists because
   without it a compaction between dispatch and recheck restores N to its previous
   value and the same task goes out a third time. Both `gwt-tests.md` and the ledger
   open with `spec: sha256 {hash of spec.md}`, measured by you when you create the file
   (§2 "Run identity", the counterpart of loop's `contract_ref`). On resume after
   compaction — and at the start of every run — recompute it before reading either
   file: a mismatch means the files are an earlier run's on a different spec, so remove
   the test files the stale `gwt-tests.md` lists, delete both files, and start Phase 3
   from the beginning instead of resuming a run that never happened on this spec. With
   a match, read the ledger first:
   - no file, or no `phase3 complete` line → Phase 3 is still running: resume it as
     before (TTs without a `gwt-tests.md` block, then the implementation tasks without
     a `task {id} done` line; after Pattern D, re-invoke loop, which resumes from its
     own `progress.md`) and run no check — judging tasks that never ran as unmet would
     spend the two rounds on the first build;
   - `phase3 complete` and nothing after it → round 0: run the full check;
   - the last entry is a `round N dispatched` line with no `## round N` table after it
     → run the full check and count its result as the end of round N, whether or not
     the workers finished. Never resume a worker;
   - the last entry is a `## round N` table, round 0's included → that check already
     ran on this tree: do not recheck. Evaluate the exit conditions from the table —
     its unmet total against the previous table's — and either write `round N+1
     dispatched` and dispatch, or end. Compaction between a table write and the next
     `dispatched` line lands here; a second check would compare the tree with itself,
     find no decrease, and end the run while rounds were still allowed.
   In every state but the last, the first action after a resume is a full check — the
   working tree is the truth. A recorded table is a check already run on that tree.

**Phase 3.5 — verification without a prompt.** The gate runs only after Phase 3.4 ended
with zero unmet in-scope GWTs; the check's other exits (`requirements unmet after N
rounds`, `requirements check failed — {reason}`) go straight to Phase 4 with no gate.
After Pattern D it runs only if at least one re-dispatch round happened: the round
changed the code after loop's embedded gates ran, so their verdict no longer describes
the tree, and loop is called again — this time as the verifier, with the framing, never
as the builder. With no round, Pattern D keeps `embedded in Loop pattern — see Loop
Report` (Rule 8). Invoke loop as in Phase 3.5 — its mandatory args, the "implementation
is already complete — start by verifying, do not redo the work" framing included, stay
as they are, and the check's verdicts are not pre-defined as gates — and add to the
args:
- `mode: unattended`;
- the spec path — loop's unattended-spec bypass reads that file's `## Meta` itself to
  skip its contract approval;
- the parked tasks and the requirements only they fulfill, marked out of scope: "verify
  only the work that ran; do not implement parked tasks". loop records this list in
  `loop.md`, so its Gate-3 checker and any resumed run see it too.
- the path of `gwt-tests.md`, when the spec has TT tasks;
- "do not modify any test file this file lists". No re-check follows Phase 3.5, so a TT
  file that loop's Auto-fix touched — adding tests and refactoring are inside its
  boundary — would otherwise land in the green commit unnoticed. This line keeps the
  "never modify a listed test file" constraint through the last phase that edits code,
  and Phase 4.2's hash comparison is the evidence behind it: an instruction to loop is
  a claim, the re-measured hashes are not.

A loop escalation (an autonomy boundary, or no progress) ends the gate with
`escalated: {reason}`; loop notifies through its own unattended channel.

**Phase 4 — report, commit, notify.** After the handoff, agent-orchestrate is the only
writer of the report; specify writes it only at its own stops, before handing off.
1. Write the Phase 4 report to `{specDir}/unattended-report.md`, and add: the parked
   tasks with their reasons, the spec's `Status: assumed` decisions, the Spec Review
   verdict, the branch, and the next step for the person — after `requirements unmet
   after N rounds` or `requirements check failed — {reason}`, that step says a re-run
   restarts on its own once the spec is edited, and otherwise resumes the ended run
   unless `requirement-check.md` and `gwt-tests.md` are removed first (§2 "Run
   identity"). When Phase 3.4 ran, add its
   outcome: a per-GWT table from the last check — verdict, grounds kind (`test` or
   `read`), reason code, the round in which the GWT first became `met` (0 for the
   initial check; `—` while still unmet),
   and every `BLOCKED:` reason a worker returned; one line with the grounds ratio,
   `grounds: test n / read m` (`read` 100% means the check rested on code reading
   alone — no test runner, no TT tasks, or every TT failed — so the person sees how
   weak the evidence is); and a summary of `requirement-check.md` — the rounds run and
   the tasks each round dispatched. Copy the verdicts as the checker returned them
   (Rule 7).
2. **Commit on green only.** The run is green only when all four hold: nothing was
   parked; Phase 3.4 ended with every in-scope GWT met; the verification state is
   `passed (N iterations)` — or, for a Pattern D run with no re-dispatch round,
   `embedded in Loop pattern` with a Loop Report verdict of all gates passed; and every
   file `gwt-tests.md` lists still matches its recorded hash — re-measure each with
   `shasum -a 256` now, after Phase 3.5, the last phase that edits code. A mismatch
   means the acceptance tests the check judged are not the ones in the tree: set
   Verification to `requirements check failed — TT file modified after the check:
   {files}`, leave everything uncommitted, and name the files in the report. A run that
   never reached a completed check is not green whatever loop reported: a Pattern D run
   whose gates all passed but that ended `requirements check failed — {reason}` stays
   uncommitted. Then commit on the current branch:
   1. Re-run the branch guard, and write "Commit: on `{branch}`, see `git log -1`"
      into the report first.
   2. `git add -A`, then `git add -f {specDir}/unattended-report.md` — `specs/` is
      gitignored in many repos (it is in this one), so without `-f` the report, the
      spec, `loop.md`, and `progress.md` are silently left out of the commit. The
      report is the only one of these forced in; the rest follow the repo's ignore
      rules.
   3. Confirm the scope: `git status --short` and compare the staged set with the
      files the spec's tasks name (plus the report). Unstage anything else — a stray
      scratch file, a debug script, a worker's temp output — with `git restore --staged`
      and list it in the report under "Left uncommitted". Nobody is watching this
      staging, so the check is the only review it gets.
   4. Write the message to `$(git rev-parse --git-dir)/unattended-commit-msg.txt` (a
      Conventional Commits subject from the spec's goal, the task list in the body, and
      the attribution trailers the session provides), and `git commit -F` that file.
   5. Verify the message: diff `git log -1 --format=%B` against that file with blank
      lines and trailing whitespace normalised on both sides. A `<` line (text missing
      from the commit) is a failure; `>` lines alone are a `commit-msg` hook appending
      and pass.
   If the commit or the verification fails, replace the "Commit:" line in the report
   with the error. Never push, never merge, never commit on the default branch. In
   every other state leave the changes uncommitted so the person reviews the diff.
3. Send a `PushNotification` with one line: the verification state, done / parked counts,
   the unmet GWT count from the last check (0 when every in-scope GWT was met; omitted
   when no check ran), the commit sha if there is one, and the report path. If
   `PushNotification` is unavailable, the report file is the record. (A loop escalation
   also sends loop's own notification first.)

---

## Rules

1. **Always ask before executing** — never skip Phase 2 confirmation. The one exception is Unattended Mode, which only a spec from an unattended specify run can enter
2. **Ralph Loop is a skill call, not a reimplementation** — use `Skill(skill="harness-ops:loop")`
3. **Parallel agents in one message** — don't spawn sequentially
4. **Match pattern to situation** — don't force a pattern; if the task is trivial, sequential is fine
5. **Pass context forward** — each step/agent needs enough context to work independently
6. **Keep proposals concise** — the user wants a recommendation, not an essay
7. **Relay the verification verdict as-is** — never fabricate or soften a failing verdict into success
8. **The verification gate never runs twice on the same code state** — the Ralph Loop pattern embeds it; Phase 3.5 skips in that case unless a re-dispatch round changed the code (Unattended Mode)
9. **Disclose auto-fix in Phase 2** — the preview must state that the gate modifies code on failure, not just reports
10. **Checker reports, workers build** — in Unattended Mode the requirement checker never edits code, tests, or the spec, and implementation workers never modify a test file listed in `gwt-tests.md` (maker ≠ checker)

User arguments: {{args}}
'''
